name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Optional: nicer Quran font. If the download fails the app still works
      # (it falls back to the phone's own Arabic font).
      - name: Download Amiri Quran font (optional)
        continue-on-error: true
        run: |
          curl -fL --retry 3 -o app/src/main/assets/www/fonts/AmiriQuran-Regular.ttf \
            https://raw.githubusercontent.com/google/fonts/main/ofl/amiriquran/AmiriQuran-Regular.ttf
          # A failed download must not leave a broken file behind
          test "$(stat -c%s app/src/main/assets/www/fonts/AmiriQuran-Regular.ttf)" -gt 50000 || rm -f app/src/main/assets/www/fonts/AmiriQuran-Regular.ttf

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Save the APK so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: QuranLearn-APK
          path: app/build/outputs/apk/debug/*.apk
